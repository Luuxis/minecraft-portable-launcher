name: Build & Release

on:
  push:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
            name: windows-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            name: linux-amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
            name: macos-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            name: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Windows : embed icon avec rsrc
      - name: Install rsrc (Windows)
        if: matrix.goos == 'windows'
        run: go install github.com/akavel/rsrc@latest

      - name: Generate syso (Windows)
        if: matrix.goos == 'windows'
        run: rsrc -ico Icon.ico -o rsrc.syso

      # Build optimisé pour release
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -trimpath -o minecraft-launcher-${{ matrix.name }}${{ matrix.ext }} .

      # macOS : créer .app bundle avec icône
      - name: Create macOS App Bundle
        if: matrix.goos == 'darwin'
        run: |
          APP_NAME="MinecraftLauncher.app"
          mkdir -p "$APP_NAME/Contents/MacOS"
          mkdir -p "$APP_NAME/Contents/Resources"
          
          mv minecraft-launcher-${{ matrix.name }} "$APP_NAME/Contents/MacOS/MinecraftLauncher"
          cp favicon.icns "$APP_NAME/Contents/Resources/AppIcon.icns"
          
          cat > "$APP_NAME/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MinecraftLauncher</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.minecraft.launcher</string>
              <key>CFBundleName</key>
              <string>Minecraft Launcher</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
          </dict>
          </plist>
          EOF
          
          zip -r minecraft-launcher-${{ matrix.name }}.zip "$APP_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-launcher-${{ matrix.name }}
          path: |
            minecraft-launcher-*${{ matrix.ext }}
            *.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true